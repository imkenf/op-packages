<style>
.bdprow{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.bdplabel{font-weight:700}
.bdpstatus{font-weight:700}
.ok{color:#00c853}
.no{color:#ff5252}
</style>

<div class="cbi-section">
  <div class="bdprow">
    <div class="bdplabel"><%:当前状态%></div>
    <div class="bdpstatus" id="service-status"><%:Collecting data...%></div>
  </div>
  <div class="bdprow">
    <div class="bdplabel"><%:启用%></div>
    <div>
      <input type="button" id="btn-start" class="cbi-button cbi-button-action" onclick="controlService('start')" value="<%:启动服务%>" style="display:none" />
      <input type="button" id="btn-stop" class="cbi-button cbi-button-negative" onclick="controlService('stop')" value="<%:停止服务%>" style="display:none" />
    </div>
  </div>
  <div id="service-message" class="bdpstatus"></div>
  <hr />
</div>

<script type="text/javascript">
var serviceStatusTimer;

function updateServiceStatus() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '<%=url("admin", "services", "beardropper", "status")%>', true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            try {
                var data = JSON.parse(xhr.responseText);
                var statusElement = document.getElementById('service-status');
                var btnStart = document.getElementById('btn-start');
                var btnStop = document.getElementById('btn-stop');

                if (data.running) {
                    statusElement.textContent = '<%:运行中%>';
                    statusElement.className = 'bdpstatus ok';
                    btnStart.style.display = 'none';
                    btnStop.style.display = 'inline-block';
                } else {
                    statusElement.textContent = '<%:未运行%>';
                    statusElement.className = 'bdpstatus no';
                    btnStart.style.display = 'inline-block';
                    btnStop.style.display = 'none';
                }
            } catch (e) {
                console.error('Failed to parse status response:', e);
            }
        }
    };
    xhr.send();
}

function controlService(action) {
    var btnStart = document.getElementById('btn-start');
    var btnStop = document.getElementById('btn-stop');
    var messageElement = document.getElementById('service-message');

    // 禁用按钮
    btnStart.disabled = true;
    btnStop.disabled = true;

    // 显示处理中状态
    messageElement.textContent = action === 'start' ? '<%:Starting service...%>' : '<%:Stopping service...%>';
    messageElement.className = 'service-message message-success';
    messageElement.style.display = 'block';

    var xhr = new XMLHttpRequest();
    xhr.open('GET', '<%=url("admin", "services", "beardropper")%>/' + action, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            btnStart.disabled = false;
            btnStop.disabled = false;

            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    messageElement.textContent = data.message || (action === 'start' ? '<%:Service started%>' : '<%:Service stopped%>');

                    // 延迟更新状态
                    setTimeout(function() {
                        updateServiceStatus();
                        // 3秒后隐藏消息
                        setTimeout(function() {
                            messageElement.textContent = '';
                        }, 3000);
                    }, 1000);
                } catch (e) {
                    messageElement.textContent = '<%:Operation failed%>';
                    messageElement.className = 'service-message message-error';
                }
            } else {
                messageElement.textContent = '<%:Network error%>';
                messageElement.className = 'service-message message-error';
            }
        }
    };
    xhr.send();
}

// 页面加载完成后立即更新状态
document.addEventListener('DOMContentLoaded', function() {
    updateServiceStatus();
    // 定期更新状态（每5秒）
    serviceStatusTimer = setInterval(updateServiceStatus, 5000);
});

// 页面卸载时清理定时器
window.addEventListener('beforeunload', function() {
    if (serviceStatusTimer) {
        clearInterval(serviceStatusTimer);
    }
});
</script>
