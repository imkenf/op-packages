<style>
.bdp-box{padding:16px 18px;background:#ffffff0d;border-radius:8px}
.bdp-row{display:flex;align-items:center;justify-content:space-between}
.bdp-left{display:flex;align-items:center;gap:12px}
.bdp-title{font-weight:700}
.bdp-badge{padding:4px 10px;border-radius:4px;font-weight:700}
.bdp-badge-ok{background:#1e7e34;color:#fff}
.bdp-badge-no{background:#9a1b24;color:#fff}
.bdp-actions{display:flex;gap:10px}
.bdp-btn{min-width:92px;padding:6px 14px;border-radius:4px;border:0;color:#fff;font-weight:700;cursor:pointer}
.bdp-btn-start{background:#1e7e34}
.bdp-btn-stop{background:#dc3545}
.bdp-note{margin-top:8px;color:#9aa3af}
</style>

<div class="bdp-box">
  <div class="bdp-row">
    <div class="bdp-left">
      <span class="bdp-title"><%:当前状态%></span>
      <span id="service-status" class="bdp-badge bdp-badge-no"><%:Collecting data...%></span>
    </div>
    <div class="bdp-actions">
      <button id="btn-start" class="bdp-btn bdp-btn-start" onclick="controlService('start')" style="display:none"><%:启动服务%></button>
      <button id="btn-stop" class="bdp-btn bdp-btn-stop" onclick="controlService('stop')" style="display:none"><%:停止服务%></button>
    </div>
  </div>
  <div id="service-message" class="bdp-note"></div>
</div>

<script type="text/javascript">
var serviceStatusTimer;

function updateServiceStatus() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '<%=url("admin", "services", "beardropper", "status")%>', true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            try {
                var data = JSON.parse(xhr.responseText);
                var statusElement = document.getElementById('service-status');
                var btnStart = document.getElementById('btn-start');
                var btnStop = document.getElementById('btn-stop');

                if (data.running) {
                    statusElement.textContent = '<%:Running%>';
                    statusElement.className = 'status-indicator status-running';
                    btnStart.style.display = 'none';
                    btnStop.style.display = 'inline-block';
                } else {
                    statusElement.textContent = '<%:Not Running%>';
                    statusElement.className = 'status-indicator status-stopped';
                    btnStart.style.display = 'inline-block';
                    btnStop.style.display = 'none';
                }
            } catch (e) {
                console.error('Failed to parse status response:', e);
            }
        }
    };
    xhr.send();
}

function controlService(action) {
    var btnStart = document.getElementById('btn-start');
    var btnStop = document.getElementById('btn-stop');
    var messageElement = document.getElementById('service-message');

    // 禁用按钮
    btnStart.disabled = true;
    btnStop.disabled = true;

    // 显示处理中状态
    messageElement.textContent = action === 'start' ? '<%:Starting service...%>' : '<%:Stopping service...%>';
    messageElement.className = 'service-message message-success';
    messageElement.style.display = 'block';

    var xhr = new XMLHttpRequest();
    xhr.open('GET', '<%=url("admin", "services", "beardropper")%>/' + action, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            btnStart.disabled = false;
            btnStop.disabled = false;

            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    messageElement.textContent = data.message || (action === 'start' ? '<%:Service started%>' : '<%:Service stopped%>');

                    // 延迟更新状态
                    setTimeout(function() {
                        updateServiceStatus();
                        // 3秒后隐藏消息
                        setTimeout(function() {
                            messageElement.textContent = '';
                        }, 3000);
                    }, 1000);
                } catch (e) {
                    messageElement.textContent = '<%:Operation failed%>';
                    messageElement.className = 'service-message message-error';
                }
            } else {
                messageElement.textContent = '<%:Network error%>';
                messageElement.className = 'service-message message-error';
            }
        }
    };
    xhr.send();
}

// 页面加载完成后立即更新状态
document.addEventListener('DOMContentLoaded', function() {
    updateServiceStatus();
    // 定期更新状态（每5秒）
    serviceStatusTimer = setInterval(updateServiceStatus, 5000);
});

// 页面卸载时清理定时器
window.addEventListener('beforeunload', function() {
    if (serviceStatusTimer) {
        clearInterval(serviceStatusTimer);
    }
});
</script>
