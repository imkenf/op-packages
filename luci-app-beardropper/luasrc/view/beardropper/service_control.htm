<style>
.service-control {
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
}

.service-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.status-label {
    font-weight: bold;
    margin-right: 10px;
}

.status-indicator {
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 4px;
}

.status-running {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}

.status-stopped {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}

.service-controls {
    display: flex;
    gap: 10px;
    align-items: center;
}

.btn-service {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s ease;
}

.btn-start {
    background-color: #28a745;
    color: white;
}

.btn-start:hover {
    background-color: #218838;
}

.btn-stop {
    background-color: #dc3545;
    color: white;
}

.btn-stop:hover {
    background-color: #c82333;
}

.btn-service:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.service-message {
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 4px;
    display: none;
}

.message-success {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}

.message-error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
</style>

<div class="service-control">
    <div class="service-status">
        <span class="status-label"><%:Current Status%>:</span>
        <span id="service-status" class="status-indicator status-stopped"><%:Collecting data...%></span>
    </div>

    <div class="service-controls">
        <span class="status-label"><%:Control%>:</span>
        <button id="btn-start" class="btn-service btn-start" onclick="controlService('start')" style="display:none;">
            <%:Start Service%>
        </button>
        <button id="btn-stop" class="btn-service btn-stop" onclick="controlService('stop')" style="display:none;">
            <%:Stop Service%>
        </button>
    </div>

    <div id="service-message" class="service-message"></div>
</div>

<script type="text/javascript">
var serviceStatusTimer;

function updateServiceStatus() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '<%=url("admin", "services", "beardropper", "status")%>', true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            try {
                var data = JSON.parse(xhr.responseText);
                var statusElement = document.getElementById('service-status');
                var btnStart = document.getElementById('btn-start');
                var btnStop = document.getElementById('btn-stop');

                if (data.running) {
                    statusElement.textContent = '<%:Running%>';
                    statusElement.className = 'status-indicator status-running';
                    btnStart.style.display = 'none';
                    btnStop.style.display = 'inline-block';
                } else {
                    statusElement.textContent = '<%:Not Running%>';
                    statusElement.className = 'status-indicator status-stopped';
                    btnStart.style.display = 'inline-block';
                    btnStop.style.display = 'none';
                }
            } catch (e) {
                console.error('Failed to parse status response:', e);
            }
        }
    };
    xhr.send();
}

function controlService(action) {
    var btnStart = document.getElementById('btn-start');
    var btnStop = document.getElementById('btn-stop');
    var messageElement = document.getElementById('service-message');

    // 禁用按钮
    btnStart.disabled = true;
    btnStop.disabled = true;

    // 显示处理中状态
    messageElement.textContent = action === 'start' ? '<%:Starting service...%>' : '<%:Stopping service...%>';
    messageElement.className = 'service-message message-success';
    messageElement.style.display = 'block';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '<%=url("admin", "services", "beardropper")%>/' + action, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            btnStart.disabled = false;
            btnStop.disabled = false;

            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    messageElement.textContent = data.message || (action === 'start' ? '<%:Service started%>' : '<%:Service stopped%>');
                    messageElement.className = data.success ? 'service-message message-success' : 'service-message message-error';

                    // 延迟更新状态
                    setTimeout(function() {
                        updateServiceStatus();
                        // 3秒后隐藏消息
                        setTimeout(function() {
                            messageElement.style.display = 'none';
                        }, 3000);
                    }, 1000);
                } catch (e) {
                    messageElement.textContent = '<%:Operation failed%>';
                    messageElement.className = 'service-message message-error';
                }
            } else {
                messageElement.textContent = '<%:Network error%>';
                messageElement.className = 'service-message message-error';
            }
        }
    };
    xhr.send();
}

// 页面加载完成后立即更新状态
document.addEventListener('DOMContentLoaded', function() {
    updateServiceStatus();
    // 定期更新状态（每5秒）
    serviceStatusTimer = setInterval(updateServiceStatus, 5000);
});

// 页面卸载时清理定时器
window.addEventListener('beforeunload', function() {
    if (serviceStatusTimer) {
        clearInterval(serviceStatusTimer);
    }
});
</script>
