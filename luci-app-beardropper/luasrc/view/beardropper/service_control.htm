<style>
/* 状态徽章（圆点 + 文字），避免只显示色块 */
.bdp-badge{display:inline-flex;align-items:center;font-weight:700}
.bdp-badge .dot{width:10px;height:10px;border-radius:50%;margin-right:6px}
.bdp-badge.ok .dot{background:#28a745}
.bdp-badge.no .dot{background:#dc3545}
.bdp-badge.ok .txt{color:#28a745}
.bdp-badge.no .txt{color:#dc3545}

/* 全页收紧行距与留白 */
.cbi-map .cbi-section .cbi-value{margin:4px 0}
.cbi-map .cbi-section .cbi-value-title,
.cbi-map .cbi-section .cbi-value-field{padding-top:2px;padding-bottom:2px}
.cbi-value-description{margin-top:2px;margin-bottom:0;line-height:1.08}
</style>

<!-- 按照 LuCI CBI 行布局渲染两行：当前状态、启用（按钮） -->
<div class="cbi-value">
  <label class="cbi-value-title"><%:当前状态%></label>
  <div class="cbi-value-field">
    <span id="service-status" class="bdp-badge no"><span class="dot"></span><span class="txt"><%:Collecting data...%></span></span>
  </div>
</div>

<div class="cbi-value">
  <label class="cbi-value-title"><%:启用%></label>
  <div class="cbi-value-field">
    <input type="button" id="btn-start" class="cbi-button cbi-button-action" onclick="controlService('start')" value="<%:启动服务%>" style="display:none" />
    <input type="button" id="btn-stop" class="cbi-button cbi-button-negative" onclick="controlService('stop')" value="<%:停止服务%>" style="display:none" />
    <div id="service-message" class="cbi-value-description"></div>
  </div>
</div>

<script type="text/javascript">
var serviceStatusTimer;

function updateServiceStatus() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '<%=url("admin", "services", "beardropper", "status")%>', true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            try {
                var data = JSON.parse(xhr.responseText);
                var statusElement = document.getElementById('service-status');
                var statusText = statusElement ? statusElement.querySelector('.txt') : null;
                var btnStart = document.getElementById('btn-start');
                var btnStop = document.getElementById('btn-stop');

                if (data.running) {
                    if (statusText) { statusText.textContent = '<%:运行中%>'; }
                    statusElement.className = 'bdp-badge ok';
                    btnStart.style.display = 'none';
                    btnStop.style.display = 'inline-block';
                } else {
                    if (statusText) { statusText.textContent = '<%:未运行%>'; }
                    statusElement.className = 'bdp-badge no';
                    btnStart.style.display = 'inline-block';
                    btnStop.style.display = 'none';
                }
            } catch (e) {
                console.error('Failed to parse status response:', e);
            }
        }
    };
    xhr.send();
}

function controlService(action) {
    var btnStart = document.getElementById('btn-start');
    var btnStop = document.getElementById('btn-stop');
    var messageElement = document.getElementById('service-message');

    // 禁用按钮
    btnStart.disabled = true;
    btnStop.disabled = true;

    // 显示处理中状态
    messageElement.textContent = action === 'start' ? '<%:Starting service...%>' : '<%:Stopping service...%>';
    messageElement.className = 'service-message message-success';
    messageElement.style.display = 'block';

    var xhr = new XMLHttpRequest();
    xhr.open('GET', '<%=url("admin", "services", "beardropper")%>/' + action, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            btnStart.disabled = false;
            btnStop.disabled = false;

            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    messageElement.textContent = data.message || (action === 'start' ? '<%:Service started%>' : '<%:Service stopped%>');

                    // 延迟更新状态
                    setTimeout(function() {
                        updateServiceStatus();
                        // 3秒后隐藏消息
                        setTimeout(function() {
                            messageElement.textContent = '';
                        }, 3000);
                    }, 1000);
                } catch (e) {
                    messageElement.textContent = '<%:Operation failed%>';
                    messageElement.className = 'service-message message-error';
                }
            } else {
                messageElement.textContent = '<%:Network error%>';
                messageElement.className = 'service-message message-error';
            }
        }
    };
    xhr.send();
}

// 页面加载完成后立即更新状态
document.addEventListener('DOMContentLoaded', function() {
    updateServiceStatus();
    // 定期更新状态（每5秒）
    serviceStatusTimer = setInterval(updateServiceStatus, 5000);
});

// 页面卸载时清理定时器
window.addEventListener('beforeunload', function() {
    if (serviceStatusTimer) {
        clearInterval(serviceStatusTimer);
    }
});
</script>
